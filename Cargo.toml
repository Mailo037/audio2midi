[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/app"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Das Modell muss auch im Debug-Build schnell laufen
[profile.dev.package."*"]
opt-level = 3
