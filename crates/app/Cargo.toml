[package]
name = "audio2midi-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "audio2midi-app"
path = "src/main.rs"

[dependencies]
audio2midi-core = { path = "../core" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
rfd = "0.17"
anyhow = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
audio2midi-core = { path = "../core", features = ["download"] }
cpal = "0.18"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "clipboard", "links"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["AudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioDestinationNode", "AudioNode", "AudioScheduledSourceNode", "BaseAudioContext", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlCanvasElement", "Document", "Window", "Element", "HtmlElement"] }
console_error_panic_hook = "0.1"
