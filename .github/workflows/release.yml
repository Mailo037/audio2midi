# Baut Desktop-App und Kommandozeile für Windows, Linux und macOS.
# Bei einem Tag (z. B. v0.1.0) werden die Dateien als Release veröffentlicht,
# sonst sind sie unter „Actions“ als Artefakte herunterladbar.
name: Programme

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            exe: .exe
          - os: ubuntu-22.04
            name: linux
            exe: ""
          - os: macos-latest
            name: macos
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux-Bibliotheken installieren
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libxkbcommon-dev

      - name: Bauen
        run: cargo build --release --locked -p audio2midi-app -p audio2midi-cli

      - name: Paket schnüren
        shell: bash
        run: |
          DIR=audio2midi-${{ matrix.name }}
          mkdir -p "$DIR"
          cp "target/release/audio2midi-app${{ matrix.exe }}" "$DIR/Audio2MIDI${{ matrix.exe }}"
          cp "target/release/audio2midi${{ matrix.exe }}" "$DIR/audio2midi${{ matrix.exe }}"
          cp README.md "$DIR/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$DIR.zip" "$DIR" > /dev/null
          else
            zip -qr "$DIR.zip" "$DIR"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: audio2midi-${{ matrix.name }}
          path: audio2midi-${{ matrix.name }}.zip

      - name: Als Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: audio2midi-${{ matrix.name }}.zip
          generate_release_notes: true
