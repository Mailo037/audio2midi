# Baut Desktop-App und Kommandozeile für Windows, Linux und macOS.
# Bei jedem Push auf main landen die Pakete im Release v<Version aus Cargo.toml>.
name: Programme

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            exe: .exe
          - os: ubuntu-22.04
            name: linux
            exe: ""
          - os: macos-latest
            name: macos
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux-Bibliotheken installieren
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libxkbcommon-dev

      - name: Bauen
        run: cargo build --release --locked -p audio2midi-app -p audio2midi-cli

      - name: Paket schnüren
        shell: bash
        run: |
          DIR=audio2midi-${{ matrix.name }}
          mkdir -p "$DIR"
          cp "target/release/audio2midi-app${{ matrix.exe }}" "$DIR/Audio2MIDI${{ matrix.exe }}"
          cp "target/release/audio2midi${{ matrix.exe }}" "$DIR/audio2midi${{ matrix.exe }}"
          cp README.md "$DIR/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$DIR.zip" "$DIR" > /dev/null
          else
            zip -qr "$DIR.zip" "$DIR"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: audio2midi-${{ matrix.name }}
          path: audio2midi-${{ matrix.name }}.zip

      - name: Version aus Cargo.toml lesen
        id: version
        shell: bash
        run: echo "tag=v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      # Legt Tag und Release an (falls nötig) und ersetzt die Pakete bei jedem Push auf main
      - name: Als Release veröffentlichen
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Audio → MIDI ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          files: audio2midi-${{ matrix.name }}.zip
          make_latest: true
          body: |
            Herunterladen, entpacken und **Audio2MIDI** starten – keine Installation nötig.

            - **Windows:** `audio2midi-windows.zip`
            - **macOS:** `audio2midi-macos.zip` (beim ersten Start Rechtsklick → „Öffnen“, da nicht signiert)
            - **Linux:** `audio2midi-linux.zip`

            Ganz ohne Download im Browser: https://mailo037.github.io/audio2midi/
