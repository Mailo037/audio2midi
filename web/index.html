<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio → MIDI</title>
  <meta name="description" content="Musik in MIDI umwandeln – direkt im Browser, ohne Upload. Notenerkennung mit Spotify Basic Pitch, in Rust.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎹</text></svg>">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1b1b1b; color: #ddd;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    canvas#app { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px;
      align-items: center; justify-content: center; text-align: center; padding: 16px; }
    #loading .spin { width: 34px; height: 34px; border: 3px solid #333; border-top-color: #5eead4;
      border-radius: 50%; animation: s 0.9s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    noscript { position: absolute; inset: 0; display: grid; place-items: center; }
  </style>
</head>
<body>
  <canvas id="app"></canvas>
  <div id="loading"><div class="spin"></div><div>Audio → MIDI wird geladen …</div></div>
  <noscript>Bitte JavaScript aktivieren.</noscript>
  <script type="module">
    import init from "./pkg/audio2midi-app.js";
    init().catch((e) => {
      document.getElementById("loading").innerHTML =
        "<p>Die App konnte nicht geladen werden. Bitte einen aktuellen Browser (Chrome, Firefox, Safari, Edge) verwenden.</p><pre>" + e + "</pre>";
    });
  </script>
</body>
</html>
